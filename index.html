<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="discription" content="" />
    <meta name="title" content="Flipkart Clone - Online Shopping India" />
    <meta
      name="description"
      content="Shop online for mobiles, electronics, fashion and more at best prices. Fast delivery and easy returns."
    />
    <meta
      name="keywords"
      content="flipkart clone, online shopping, mobiles, electronics, fashion, ecommerce"
    />
    <meta name="author" content="Mantu Morya" />
    <title>Flipkart Layout</title>
    <link rel="stylesheet" href="./CSS/index.css" />
    <link rel="stylesheet" href="./CSS/responsive.css" />
    <link rel="icon" href="./assets/icon/flipkart.svg" />
  </head>
  <body>
    <header class="header-main">
      <nav class="header">
        <div class="headder-left">
          <a href="#"><img src="./assets/icon/flipkart-header.svg" alt="" /></a>
          <input
            type="text"
            placeholder="Search For Products, brands and more"
          />
        </div>
        <div class="headder-right">
          <div class="header-right-login">
            <a href="#">Login</a>
          </div>
          <div class="headder-right-svg-more">
            <a href="#"
              ><span>More</span><img src="./assets/icon/dropdown.svg" alt=""
            /></a>
          </div>
          <div class="headder-right-cart">
            <a href="#"
              ><img src="./assets/icon/cart.svg" alt="" /><span>Cart</span></a
            >
          </div>
        </div>
      </nav>
    </header>
    <main class="main">
      <div class="top-main">
        <section class="top-main-categories">
          <a href="#" class="categories-item" title="Top Offers">
            <img src="./assets/image/categories/top-offers.svg" alt="" />
            <span>Top Offers</span>
          </a>
          <a href="#" class="categories-item" title="Grocery">
            <img src="./assets/image/categories/grocery.svg" alt="" />
            <span>Grocery</span>
          </a>
          <a href="#" class="categories-item" title="Mobiles">
            <img src="./assets/image/categories/mobiles.svg" alt="" />
            <span>Mobiles</span>
          </a>
          <a href="#" class="categories-item" title="Fashion">
            <img src="./assets/image/categories/fashion.svg" alt="" />
            <span
              >Fashion <img src="./assets/icon/caret-down.svg" alt=""
            /></span>
          </a>
          <a href="#" class="categories-item" title="Electronics">
            <img src="./assets/image/categories/electronics.svg" alt="" />
            <span
              >Electronics <img src="./assets/icon/caret-down.svg" alt="" />
            </span>
          </a>
          <a href="#" class="categories-item" title="Home">
            <img src="./assets/image/categories/home.svg" alt="" />
            <span>Home <img src="./assets/icon/caret-down.svg" alt="" /> </span>
          </a>
          <a href="#" class="categories-item" title="Appliances">
            <img src="./assets/image/categories/appliances.svg" alt="" />
            <span
              >Appliances <img src="./assets/icon/caret-down.svg" alt="" />
            </span>
          </a>
          <a href="#" class="categories-item" title="Travel">
            <img src="./assets/image/categories/travel.svg" alt="" />
            <span>Travel</span>
          </a>
          <a href="#" class="categories-item" title="Beauty, Toys & More">
            <img src="./assets/image/categories/beauty-toys.svg" alt="" />
            <span
              >Beauty, Toys & More
              <img src="./assets/icon/caret-down.svg" alt="" />
            </span>
          </a>
        </section>
      </div>

      <div class="bottom-main">Bm</div>
    </main>
    <!-- <footer class="footer">F</footer> -->
  </body>
</html>
